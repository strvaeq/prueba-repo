<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510"><rect width="1120" height="510" rx="22" fill="#101e32"/><text x="42" y="54" fill="#f6f8fb" font-family="Arial,sans-serif" font-size="27" font-weight="bold">RENKAY / SAMI</text><text x="42" y="85" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="16">ROBOTEK PERU  ·  WRO 2026 FUTURE ENGINEERS</text><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#67d9c5" stroke-width="1.5"/></marker></defs><rect x="42" y="130" width="490" height="285" rx="12" fill="#1c304a" stroke="#34526e"/><text x="60" y="161" fill="#78e5d0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">A vehicle. An engineering story.</text><text x="60" y="188" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Mechanical design that can be explained.</text><text x="60" y="210" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Sensing that supports a decision.</text><text x="60" y="232" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Software linked to the real machine.</text><text x="60" y="254" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Tests that reveal both progress and limits.</text><rect x="570" y="130" width="505" height="125" rx="12" fill="#1c304a" stroke="#34526e"/><text x="588" y="161" fill="#78e5d0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">OPEN CHALLENGE</text><text x="588" y="188" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Read the field. Follow the island.</text><text x="588" y="210" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Complete the route and stop.</text><rect x="570" y="280" width="505" height="135" rx="12" fill="#1c304a" stroke="#34526e"/><text x="588" y="311" fill="#78e5d0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">OBSTACLE CHALLENGE</text><text x="588" y="338" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Locate signs. Choose a passing side.</text><text x="588" y="360" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Navigate, return and park.</text></svg>
