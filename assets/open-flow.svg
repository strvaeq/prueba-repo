<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510"><rect width="1120" height="510" rx="22" fill="#101e32"/><text x="42" y="54" fill="#f6f8fb" font-family="Arial,sans-serif" font-size="27" font-weight="bold">Open v5: mission and internal actions</text><text x="42" y="85" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="16">Mission states are SETUP, RUN and STOP; straight, arc and finish are actions within RUN.</text><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#67d9c5" stroke-width="1.5"/></marker></defs><path d="M292 245 L390 245" stroke="#67d9c5" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 245 L818 245" stroke="#67d9c5" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="160" width="250" height="170" rx="12" fill="#1c304a" stroke="#34526e"/><text x="60" y="191" fill="#78e5d0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">SETUP</text><text x="60" y="218" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Wait for Start</text><text x="60" y="240" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Estimate gyro bias</text><text x="60" y="262" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Select direction</text><rect x="390" y="160" width="330" height="170" rx="12" fill="#1c304a" stroke="#34526e"/><text x="408" y="191" fill="#78e5d0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">RUN</text><text x="408" y="218" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Straight / corner alternation</text><text x="408" y="240" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">12 corners for three laps</text><text x="408" y="262" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Return to start-range reference</text><rect x="818" y="160" width="250" height="170" rx="12" fill="#1c304a" stroke="#34526e"/><text x="836" y="191" fill="#78e5d0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">STOP</text><text x="836" y="218" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Normal completion or fault</text><text x="836" y="240" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Zero motion request</text><text x="836" y="262" fill="#e6edf7" font-family="Arial,sans-serif" font-size="15">Wrapper reports final status</text></svg>
